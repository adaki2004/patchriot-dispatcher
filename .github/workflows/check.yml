name: Check
on:
  pull_request:
    branches: [main, 'feature/**']
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
defaults:
  run:
    working-directory: patchriot-dispatcher
jobs:
  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232 # 17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture_password
          POSTGRES_DB: patchriot_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PATCHRIOT_TEST_DATABASE_URL: postgres://postgres:fixture_password@127.0.0.1:5432/patchriot_tests
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: patchriot-dispatcher
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: adaki2004/patchriot-core
          ref: cbdf57480bc77a4c6dffbca0e9ab325b0d07f92d
          path: patchriot-core
          token: ${{ secrets.PATCHRIOT_READ_TOKEN || secrets.READ_TOKEN || github.token }}
          persist-credentials: false
      - run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
