[package]
name = "patchriot-dispatcher"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
patchriot-protocol = { path = "../patchriot-core/crates/protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tower-http = { version = "0.6", features = ["set-header"] }
uuid = { version = "1.22", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
