[package]
name = "patchriot-dispatcher"
default-run = "patchriot-dispatcher"
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
publish = false

[dependencies]
flate2 = "1"
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "https-aws-lc-rs", "dnssec-aws-lc-rs", "webpki-roots"] }
patchriot-protocol = { path = "../patchriot-core/crates/protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
scraper = { version = "0.27", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower-http = { version = "0.6", features = ["set-header"] }
uuid = { version = "1.22", features = ["serde", "v4"] }
url = "2.5"
aes-gcm = "0.11.1"
zeroize = "1.9"
hex = "0.4"
getrandom = "0.4"
nearai-inference-sdk = "=0.2.1"
futures-util = "0.3"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["io-util", "test-util"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
